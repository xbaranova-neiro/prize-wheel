<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6548e8">
  <meta name="description" content="Колесо призов — крутите колесо и получайте подарок">
  <title>Колесо призов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236548e8'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34'%3E🎁%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <header class="header">
      <a class="brand" href="./" aria-label="Колесо призов"><span class="brand-icon">🎁</span><span>колесо<small>ПРИЗОВ</small></span></a>
      <span class="status"><i></i> Розыгрыш открыт</span>
    </header>

    <section class="stage">
      <div class="visual">
        <p class="eyebrow">✦ ПОДАРОК ДЛЯ ВАС</p>
        <h1>Ваш следующий<br>приятный сюрприз</h1>
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <div class="wheel" id="wheel" aria-label="Колесо призов"></div>
          <div class="hub">✦</div>
        </div>
      </div>

      <div class="action">
        <div class="gift-icon" id="resultIcon">🎁</div>
        <p class="overline" id="overline">ВАША ПОПЫТКА ГОТОВА</p>
        <h2 id="result">Нажмите кнопку — и колесо выберет ваш приз</h2>
        <button class="spin" id="spin" type="button"><span>↻</span> Крутить колесо</button>
        <p class="message" id="message" role="status" aria-live="polite">У вас одна попытка в этом розыгрыше</p>
        <button class="again" id="again" type="button" hidden>Попробовать ещё раз</button>
        <div class="prizes" id="prizes"><p>В КОЛЕСЕ СЕГОДНЯ</p></div>
      </div>
    </section>
    <footer>Результат определяется автоматически и сохраняется в этом браузере.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
