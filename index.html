<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6548e8">
  <meta name="description" content="Колесо подарков — три прокрутки и двенадцать полезных материалов">
  <title>Колесо подарков — 16 сентября</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236548e8'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34'%3E🎁%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="rounds.css">
</head>
<body>
  <main class="page">
    <div class="glow glow-one"></div><div class="glow glow-two"></div>
    <header class="header">
      <a class="brand" href="./" aria-label="Колесо подарков"><span class="brand-icon">🎁</span><span>колесо<small>ПОДАРКОВ</small></span></a>
    </header>

    <section class="stage">
      <div class="visual">
        <p class="eyebrow" id="roundLabel">✦ ПЕРВАЯ ПРОКРУТКА</p>
        <h1>Ваш полезный<br>подарок уже здесь</h1>
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <div class="wheel" id="wheel" aria-label="Колесо подарков"></div>
          <div class="hub">✦</div>
        </div>
      </div>

      <div class="action">
        <div class="gift-icon" id="resultIcon">🎁</div>
        <p class="overline" id="overline">ОДНА ПОПЫТКА • ОДИН ПОДАРОК</p>
        <h2 id="result">Нажмите кнопку — и колесо выберет ваш подарок</h2>
        <p class="description" id="description"></p>
        <button class="spin" id="spin" type="button"><span>↻</span> Крутить колесо</button>
        <a class="download" id="download" target="_blank" rel="noopener" hidden><span>↓</span> Скачать подарок</a>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <div class="prizes" id="prizes"><p>В ЭТОЙ ПРОКРУТКЕ</p></div>
      </div>
    </section>
    <footer>Три прокрутки • двенадцать подарков • прямое скачивание с Google Drive</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
